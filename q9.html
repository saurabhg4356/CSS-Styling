<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .linear{
            background: linear-gradient(to right, red, blue, violet, pink, yellow );
            color: white;
            text-align: center;
            padding: 60px;
            margin: 20px 37%;
        }
        .radial{
            background: radial-gradient(circle, red, blue, violet, pink, yellow );
            color: white;
            text-align: center;
            padding: 60px;
            margin: 20px 37%;
        }
    </style>
</head>
<body>
    <div class="linear"><p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Maiores, nesciunt.</p></div>
    <div class="radial"><p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptates, harum?</p></div>
</body>
</html>
